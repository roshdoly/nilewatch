[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nilewatch"
version = "0.1.0"
description = "Drought and water monitoring for Egypt and the Nile Basin from open satellite and climate data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nilewatch = "nilewatch.cli:main"

[tool.setuptools]
packages = ["nilewatch"]
